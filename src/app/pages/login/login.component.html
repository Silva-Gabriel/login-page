<app-default-login-layout 
    title="Login into your account"
    primaryBtnText="Login"
    secondaryBtnText="Sign up" 
    (submit)="submit()" 
    (navigate)="navigate()"
    [disablePrimaryBtn]="loginForm.invalid">
    <form [formGroup]="loginForm">
        <app-primary-input formControlName="email" inputName="email" type="email" placeholder="seuemail@email.com" label="Email">
            <img src="email_icon.png" width="24" alt="">
        </app-primary-input>
        <app-primary-input formControlName="password" inputName="password" type="password" label="Your Password">
            <img src="senha_icon.png" width="24" alt="">
        </app-primary-input>
        <span>Forgot Password?</span>
    </form>
</app-default-login-layout>
