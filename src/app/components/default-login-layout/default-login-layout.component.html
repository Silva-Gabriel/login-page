<main>
    <section class="form-section">
        <img src="MoveIt_img.png" width="200" alt="Nenhuma imagem a ser mostrada">
        <h2>{{ title }}</h2>
        <ng-content></ng-content>
        <div class="btn-wrapper">
            <button class="btn-primary" (click)="submit()" [disabled]="disablePrimaryBtn">{{ primaryBtnText }}</button>
            <div class="divider">
                <div></div>
                <span>OR</span>
                <div></div>
            </div>
            <button class="btn-secondary" (click)="navigate()">{{ secondaryBtnText }}</button>
        </div>
    </section>
    <section class="main-section">
        <h1>
            You Should, MoveIt!
        </h1>
        <img src="run_img.png" width="600" alt="">
    </section>
</main>
